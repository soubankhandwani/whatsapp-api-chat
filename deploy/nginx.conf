# WhatsApp Chat Dashboard — Nginx Configuration
# Place this in /etc/nginx/sites-available/whatsapp-chat

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name chat.yourdomain.com chat-api.yourdomain.com;
    return 301 https://$host$request_uri;
}

# Frontend (chat.yourdomain.com)
server {
    listen 443 ssl http2;
    server_name chat.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/chat.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/whatsapp-chat/frontend/dist;
    index index.html;

    # SPA support — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}

# Backend API (chat-api.yourdomain.com)
server {
    listen 443 ssl http2;
    server_name chat-api.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/chat-api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat-api.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Increase timeouts for webhook reliability
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Max body size for webhook payloads
    client_max_body_size 10M;

    # API routes
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL for cookies
        proxy_set_header Cookie $http_cookie;
    }

    # WebSocket — Socket.IO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeout — keep alive
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Webhook endpoint — ensure it's publicly accessible
    # Meta sends POST requests here
    location /api/webhook {
        proxy_pass http://127.0.0.1:5000/api/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass the signature header
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
    }
}
